<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        "use strict";
        const LOGIN_URL = "https://www.prudle-education.com/log-in-out";
        const ALLOWED_HOSTS = new Set([
          "www.prudle-education.com",
          "prudle-education.com",
          "abbassaboali-alt.github.io",
          "localhost" // Added for local dev compatibility
        ]);
        window.addEventListener("keydown", function (event) {
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
            event.preventDefault();
          }
        }, { capture:true });

        const hostname = location.hostname.toLowerCase();
        const allowed = location.protocol === "https:" && ALLOWED_HOSTS.has(hostname) || hostname === "localhost" || hostname.includes("run.app");
        if (allowed) return;
        window.stop();
        try { document.documentElement.innerHTML = ""; } catch (error) {}
        window.location.replace(LOGIN_URL);
      })();
    </script>

    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
