(function () {
  "use strict";
  const LOGIN_URL = "https://www.prudle-education.com/log-in-out";
  const ALLOWED_HOSTS = new Set([
    "www.prudle-education.com",
    "prudle-education.com",
    "abbassaboali-alt.github.io"
  ]);

  // Convenience deterrent only, not a way to protect downloadable source.
  window.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "s") {
      event.preventDefault();
    }
  }, { capture: true });

  const allowed = location.protocol === "https:" &&
                  ALLOWED_HOSTS.has(location.hostname.toLowerCase());
  if (allowed) return;

  try {
    window.stop();
  } catch (e) {}

  try {

  } catch (e) {
    window.location.replace(LOGIN_URL);
  }
})();

<script>
/* =========================================================
   PRUDLE ATTENDANCE
   - Secure Cloudflare Worker integration (/auth/login & /db)
   - Zero Firebase credentials or browser SDK in frontend
   - Live course open/close compatibility
   - Immediate redirect on unauthenticated states
   ========================================================= */

const LOGIN_URL = "https://www.prudle-education.com/log-in-out";
const WORKER_URL = "https://api-prudle.abbassaboali.workers.dev";

let CURRENT_USER = "";
let CURRENT_ROLES = [];
let PRUDLE_USER = null;
let APP_STARTED = false;

function normalizeRoles(userData){
  let roles = [];
  if(userData && Array.isArray(userData.roles)) roles = [...userData.roles];
  else if(userData && typeof userData.roles === "string") roles = userData.roles.split(",");
  if(userData && userData.role) roles.push(userData.role);
  return [...new Set(roles.map(role=>String(role || "").trim().toLowerCase()).filter(Boolean))];
}

function clearLocalSession(){
  localStorage.removeItem("username");
  localStorage.removeItem("role");
  localStorage.removeItem("roles");
  localStorage.removeItem("userRole");
  localStorage.removeItem("loginDate");
  localStorage.removeItem("authUid");
  localStorage.removeItem("prudleDeviceSessionId");
  localStorage.removeItem("prudleDeviceSessionStartedAt");
  sessionStorage.removeItem("firebaseToken");
  sessionStorage.removeItem("firebaseUid");
  sessionStorage.clear();
}

function redirectToLogin(){
  clearLocalSession();
  try{
    window.top.location.replace(LOGIN_URL);
  }catch(error){
    window.location.replace(LOGIN_URL);
  }
}

async function logout(){
  localStorage.setItem("prudleLoggedOut","1");
  clearLocalSession();
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage("PRUDLE_LOGOUT","https://www.prudle-education.com");
    }
  }catch(error){
    console.warn("Logout message error:",error);
  }
  try{ window.top.location.replace(LOGIN_URL + "?logout=" + Date.now()); }
  catch(error){ window.location.replace(LOGIN_URL + "?logout=" + Date.now()); }
}

function getSessionToken(){
  return sessionStorage.getItem("firebaseToken") || "";
}

function getSessionUid(){
  return sessionStorage.getItem("firebaseUid") || "";
}

function tokenLooksUsable(token){
  try{
    const parts = token.split(".");
    if(parts.length !== 3) return false;
    const payload = JSON.parse(atob(parts[1].replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(parts[1].length/4)*4,"=")));
    return !payload.exp || (payload.exp * 1000) > (Date.now() + 5000);
  }catch(error){
    return false;
  }
}

async function workerLogin(email, password){
  const response = await fetch(WORKER_URL + "/auth/login",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      email,
      password
    })
  });
  const result = await response.json().catch(()=>({}));
  if(!response.ok || result.success !== true || !result.idToken){
    throw new Error(result.error || result.message || "Login failed");
  }
  sessionStorage.setItem("firebaseToken",result.idToken);
  if(result.localId){
    sessionStorage.setItem("firebaseUid",result.localId);
  }
  return result;
}

async function workerRequest(path,options={}){
  const token = getSessionToken();
  if(!token || !tokenLooksUsable(token)){
    redirectToLogin();
    throw new Error("Authentication required");
  }
  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {}),
    "Authorization":"Bearer " + token
  };
  const response = await fetch(WORKER_URL + path,{...options,headers});
  const result = await response.json().catch(()=>({}));
  if(!response.ok || result.success === false || result.ok === false){
    if(response.status === 401 || response.status === 403){
      redirectToLogin();
    }
    throw new Error(result.error || result.message || ("Worker request failed: HTTP " + response.status));
  }
  return result;
}

function workerDocuments(result){
  const data = result && result.data;
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.documents)) return data.documents;
  if(Array.isArray(result && result.documents)) return result.documents;
  return [];
}

async function findPrudleUser(firebaseUid){
  if(!firebaseUid) return null;
  const result = await workerRequest("/db",{
    method:"POST",
    body:JSON.stringify({
      action:"query",
      collection:"USERS",
      filters:[{field:"authUid",op:"==",value:firebaseUid}],
      limit:1
    })
  });
  const docs = workerDocuments(result);
  return docs.length ? docs[0] : null;
}

async function verifyAuthentication(){
  const token = getSessionToken();
  const firebaseUid = getSessionUid();
  if(!token || !firebaseUid || !tokenLooksUsable(token)){
    redirectToLogin();
    return false;
  }
  try{
    const userData = await findPrudleUser(firebaseUid);
    if(!userData) throw new Error("USER_RECORD_NOT_FOUND");
    const roles = normalizeRoles(userData);
    if(!roles.includes("trainer") && !roles.includes("admin")){
      alert("هذه الصفحة مخصصة للمدربين فقط.");
      try{ window.top.location.replace("https://www.prudle-education.com/dashboard-manager"); }
      catch(e){ window.location.replace("https://www.prudle-education.com/dashboard-manager"); }
      return false;
    }
    const username = String(
      userData.username || userData.userName || userData.name || userData.fullName ||
      localStorage.getItem("username") || ""
    ).trim();
    if(!username) throw new Error("USERNAME_NOT_FOUND");
    CURRENT_USER = username.toLowerCase();
    CURRENT_ROLES = roles;
    PRUDLE_USER = userData;
    localStorage.setItem("username",username);
    localStorage.setItem("roles",JSON.stringify(roles));
    localStorage.setItem("role",roles[0] || "trainer");
    localStorage.setItem("userRole",roles[0] || "trainer");
    localStorage.setItem("authUid",firebaseUid);
    localStorage.setItem("loginDate",new Date().toDateString());
    localStorage.removeItem("prudleLoggedOut");
    currentUserLabel.textContent = username || "Trainer";
    document.documentElement.classList.remove("prudle-auth-pending");
    return true;
  }catch(error){
    console.error("Authentication error:",error);
    redirectToLogin();
    return false;
  }
}

function startApp(){
  if(APP_STARTED) return;
  APP_STARTED = true;
  startCoursesListener();
}

setTimeout(async()=>{
  const allowed = await verifyAuthentication();
  if(allowed) startApp();
},0);

/* =========================

let COURSES = [];
let STUDENTS = [];

let unsubscribeCourses = null;
let unsubscribeStudents = null;

let selectedCourseId = "";

const savingCells = new Set();

/* =========================
   UI HELPERS
========================= */

function showToast(message,isError=false){
  toast.classList.toggle("error",!!isError);
  toast.querySelector("i").className =
    isError
      ? "fa-solid fa-circle-exclamation"
      : "fa-solid fa-circle-check";

  toastMsg.textContent = message;
  toast.style.display = "flex";

  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>{
    toast.style.display = "none";
  },2600);
}

function setBusy(show,text="Saving..."){
  busyText.textContent = text;
  busyOverlay.style.display = show ? "flex" : "none";
}

function showTableMessage(type,title,subtitle=""){
  thead.innerHTML = "";

  const icon =
    type === "error"
      ? "fa-triangle-exclamation"
      : type === "loading"
        ? ""
        : "fa-calendar-check";

  const cls =
    type === "error"
      ? "error-state"
      : type === "loading"
        ? "loading-state"
        : "empty-state";

  tbody.innerHTML = `
    <tr>
      <td>
        <div class="${cls}">
          ${
            type === "loading"
              ? '<div class="spinner"></div>'
              : `<div class="state-icon"><i class="fa-solid ${icon}"></i></div>`
          }
          <div>${escapeHtml(title)}</div>
          ${subtitle ? `<div style="font-size:11px;font-weight:700;margin-top:5px">${escapeHtml(subtitle)}</div>` : ""}
        </div>
      </td>
    </tr>
  `;
}

function escapeHtml(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    ch=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[ch])
  );
}

function normalizeStatus(value){
  const status = String(value || "open").trim().toLowerCase();
  return status === "closed" ? "closed" : "open";
}

function isCourseOpen(course){
  return normalizeStatus(course?.status) === "open";
}

function updateCourseState(course){
  courseState.className = "course-state";

  if(!course){
    courseState.innerHTML =
      '<i class="fa-solid fa-circle-info"></i><span>Select a course</span>';
    return;
  }

  if(isCourseOpen(course)){
    courseState.classList.add("open");
    courseState.innerHTML =
      '<i class="fa-solid fa-circle-check"></i><span>Course is open</span>';
  }else{
    courseState.classList.add("closed");
    courseState.innerHTML =
      '<i class="fa-solid fa-lock"></i><span>Course is closed</span>';
  }
}

/* =========================
   DATE HELPERS
========================= */

function parseDateOnly(value){
  if(!value) return null;

  if(value && typeof value.toDate === "function"){
    const d = value.toDate();
    return new Date(d.getFullYear(),d.getMonth(),d.getDate());
  }

  if(value.seconds){
    const d = new Date(value.seconds * 1000);
    return new Date(d.getFullYear(),d.getMonth(),d.getDate());
  }

  const text = String(value).trim();

  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(text)){
    const [y,m,d] = text.split("-").map(Number);
    return new Date(y,m-1,d);
  }

  const parsed = new Date(text);

  if(isNaN(parsed)) return null;

  return new Date(
    parsed.getFullYear(),
    parsed.getMonth(),
    parsed.getDate()
  );
}

function toDateKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function dateRange(startValue,endValue){
  const start = parseDateOnly(startValue);
  const end   = parseDateOnly(endValue);

  if(!start || !end || end < start){
    return [];
  }

  const result = [];
  const cursor = new Date(start);

  while(cursor <= end && result.length < 120){
    result.push(toDateKey(cursor));
    cursor.setDate(cursor.getDate()+1);
  }

  return result;
}

function dayName(dateKey){
  const d = parseDateOnly(dateKey);

  return d
    ? d.toLocaleDateString("en-US",{weekday:"short"})
    : "";
}

function isWeekend(dateKey){
  const d = parseDateOnly(dateKey);
  if(!d) return false;

  const day = d.getDay();
  return day === 5 || day === 6;
}

/* =========================
   COURSE SORTING
========================= */

function getLevelNumber(courseName){
  const text = String(courseName || "");
  const match = text.match(/\d+/);
  return match ? Number(match[0]) : 999;
}

function getPeriodStartMinutes(period){
  const text = String(period || "").trim();

  const match =
    text.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i);

  if(!match) return 9999;

  let hour = Number(match[1]);
  const minute = Number(match[2] || 0);
  const suffix = String(match[3] || "").toUpperCase();

  if(suffix === "PM" && hour !== 12) hour += 12;
  if(suffix === "AM" && hour === 12) hour = 0;

  return hour * 60 + minute;
}

function sortCourses(list){
  return [...list].sort((a,b)=>{
    const levelA = getLevelNumber(a.TrainingCourse);
    const levelB = getLevelNumber(b.TrainingCourse);

    if(levelA !== levelB){
      return levelA - levelB;
    }

    const nameCompare =
      String(a.TrainingCourse || "")
        .localeCompare(
          String(b.TrainingCourse || ""),
          undefined,
          {numeric:true}
        );

    if(nameCompare !== 0){
      return nameCompare;
    }

    return (
      getPeriodStartMinutes(a.Period) -
      getPeriodStartMinutes(b.Period)
    );
  });
}

/* =========================
   COURSES RETRIEVAL
========================= */

function trainerMatches(course){
  return String(course.Trainer || "")
    .trim()
    .toLowerCase() === CURRENT_USER;
}

async function startCoursesListener(){
  if(unsubscribeCourses){ try{unsubscribeCourses();}catch(error){} }
  unsubscribeCourses = null;
  showTableMessage("loading","Loading courses...");
  try{
    const result = await workerRequest("/db",{
      method:"POST",
      body:JSON.stringify({action:"query",collection:"Courses",filters:[]})
    });
    courseSnapshotLoaded = true;
    const previousSelected = selectedCourseId;
    COURSES = workerDocuments(result)
      .map(course=>({...course,status:normalizeStatus(course.status)}))
      .filter(trainerMatches);
    refreshCourseFilter(previousSelected);
  }catch(error){
    console.error("Courses load error:",error);
    courseFilter.innerHTML = '<option value="">Unable to load courses</option>';
    showTableMessage("error","Unable to load courses");
    showToast("Unable to load courses",true);
  }
}

function refreshCourseFilter(preferredId=""){
  const openCourses =
    sortCourses(
      COURSES.filter(isCourseOpen)
    );

  const currentValue =
    preferredId ||
    courseFilter.value ||
    selectedCourseId;

  courseFilter.innerHTML =
    '<option value="">Select Level & Period</option>';

  openCourses.forEach(course=>{
    const option = document.createElement("option");

    option.value = course.id;

    const title =
      course.TrainingCourse || "Course";

    const period =
      course.Period || "No Period";

    const branch =
      course.Branch ? ` • ${course.Branch}` : "";

    option.textContent =
      `${title} • ${period}${branch}`;

    courseFilter.appendChild(option);
  });

  const selectedStillOpen =
    openCourses.some(c=>c.id === currentValue);

  if(selectedStillOpen){
    courseFilter.value = currentValue;

    if(selectedCourseId !== currentValue || !ACTIVE_COURSE){
      selectCourse(currentValue);
    }else{
      ACTIVE_COURSE =
        COURSES.find(c=>c.id === currentValue) || null;

      updateCourseState(ACTIVE_COURSE);
      DAYS = buildCourseDays(ACTIVE_COURSE);
      renderHead();
      render();
    }

    return;
  }

  if(currentValue){
    const oldCourse =
      COURSES.find(c=>c.id === currentValue);

    if(oldCourse && !isCourseOpen(oldCourse)){
      showToast(
        "This course was closed and has been removed from attendance.",
        true
      );
    }
  }

  resetActiveCourse();

  if(courseSnapshotLoaded){
    if(openCourses.length){
      showTableMessage(
        "empty",
        "Select a course to start attendance"
      );
    }else{
      showTableMessage(
        "empty",
        "No open courses are assigned to you",
        "When a course is opened from Course Management, it will appear here automatically."
      );
    }
  }
}

function buildCourseDays(course){
  if(!course) return [];

  return dateRange(
    course.StartingDate ||
      course.StartDate ||
      course.startDate ||
      course.CourseStartDate,
    course.EndingDate ||
      course.EndDate ||
      course.CourseEndDate ||
      course.FinishingDate ||
      course.finishDate ||
      course.endingDate
  );
}

courseFilter.addEventListener("change",()=>{
  selectCourse(courseFilter.value);
});

/* =========================
   ACTIVE COURSE / STUDENTS
========================= */

function resetActiveCourse(){
  selectedCourseId = "";
  ACTIVE_COURSE = null;
  STUDENTS = [];
  FILTERED = [];
  DAYS = [];

  if(unsubscribeStudents){
    try{ unsubscribeStudents(); }catch(e){}
    unsubscribeStudents = null;
  }

  courseFilter.value = "";
  updateCourseState(null);
}

function selectCourse(courseId){
  if(unsubscribeStudents){
    try{ unsubscribeStudents(); }catch(e){}
    unsubscribeStudents = null;
  }

  selectedCourseId = courseId || "";

  if(!courseId){
    ACTIVE_COURSE = null;
    STUDENTS = [];
    FILTERED = [];
    DAYS = [];
    updateCourseState(null);
    showTableMessage(
      "empty",
      "Select a course to start attendance"
    );
    return;
  }

  ACTIVE_COURSE =
    COURSES.find(c=>c.id === courseId) || null;

  if(!ACTIVE_COURSE || !isCourseOpen(ACTIVE_COURSE)){
    refreshCourseFilter("");
    return;
  }

  updateCourseState(ACTIVE_COURSE);

  DAYS = buildCourseDays(ACTIVE_COURSE);

  if(!DAYS.length){
    STUDENTS = [];
    FILTERED = [];

    showTableMessage(
      "error",
      "Course dates are incomplete",
      "Check the course start and end dates in Course Management."
    );

    return;
  }

  renderHead();
  showRowsLoading();

  unsubscribeStudents = null;

  (async()=>{
    try{
      const result = await workerRequest(
        "/students?courseId=" + encodeURIComponent(courseId),
        {method:"GET"}
      );

      const latestCourse = COURSES.find(c=>c.id === courseId);
      if(!latestCourse || !isCourseOpen(latestCourse)){
        refreshCourseFilter("");
        return;
      }

      STUDENTS = Array.isArray(result.data) ? result.data : [];
      FILTERED = [...STUDENTS];
      render();
    }catch(error){
      console.error("Students load error:",error);
      showTableMessage("error","Unable to load students");
      showToast("Unable to load students",true);
    }
  })();
}

function showRowsLoading(){
  if(!DAYS.length){
    showTableMessage("loading","Loading students...");
    return;
  }

  tbody.innerHTML = `
    <tr>
      <td colspan="${DAYS.length + 3}">
        <div class="loading-state">
          <div class="spinner"></div>
          Loading students...
        </div>
      </td>
    </tr>
  `;
}

/* =========================
   ATTENDANCE HELPERS
========================= */

function normalizeRecords(records){
  return Array.isArray(records) ? records : [];
}

function summarize(records=[]){
  let P=0;
  let A=0;
  let L=0;

  normalizeRecords(records).forEach(record=>{
    if(record.status === "present") P++;
    if(record.status === "late") L++;
    if(record.status === "absent") A++;
  });

  return {
    P,
    A,
    L,
    total:P+A+L
  };
}

function nextStatus(current){
  if(current === "present") return "late";
  if(current === "late") return "absent";
  if(current === "absent") return "";
  return "present";
}

function getStatus(records=[],dateKey){
  const matched =
    normalizeRecords(records)
      .filter(record=>record.date === dateKey);

  return matched.length
    ? matched[matched.length-1].status
    : "";
}

function replaceDayStatus(records,dateKey,status){
  const next =
    normalizeRecords(records)
      .filter(record=>record.date !== dateKey);

  if(status){
    next.push({
      date:dateKey,
      status
    });
  }

  return next;
}

/* =========================
   HEADER
========================= */

function renderHead(){
  if(!ACTIVE_COURSE || !DAYS.length){
    thead.innerHTML = "";
    return;
  }

  thead.innerHTML = `
    <tr>
      <th class="sticky-index">#</th>
      <th class="sticky-name">Student</th>

      ${DAYS.map(dateKey=>`
        <th class="${isWeekend(dateKey) ? "weekend" : ""}">
          <div class="day-title">${escapeHtml(dayName(dateKey))}</div>
          <div class="day-date">${escapeHtml(dateKey)}</div>

          <div class="col-tools">
            <span
              class="col-btn"
              title="Present all"
              onclick="setColumnStatus('${dateKey}','present')">
              <i class="fa-solid fa-check"></i>
            </span>

            <span
              class="col-btn"
              title="Absent all"
              onclick="setColumnStatus('${dateKey}','absent')">
              <i class="fa-solid fa-xmark"></i>
            </span>

            <span
              class="col-btn"
              title="Clear"
              onclick="setColumnStatus('${dateKey}','')">
              <i class="fa-solid fa-rotate-left"></i>
            </span>
          </div>
        </th>
      `).join("")}

      <th>%</th>
    </tr>
  `;
}

/* =========================
   SINGLE CELL SAVE
========================= */

async function toggleCell(studentId,dateKey){
  if(!ACTIVE_COURSE || !isCourseOpen(ACTIVE_COURSE)){
    showToast(
      "The course is closed. Attendance cannot be changed.",
      true
    );
    refreshCourseFilter("");
    return;
  }

  const saveKey = `${studentId}__${dateKey}`;

  if(savingCells.has(saveKey)){
    return;
  }

  const student =
    STUDENTS.find(item=>item.id === studentId);

  if(!student){
    return;
  }

  const oldRecords =
    [...normalizeRecords(student.records)];

  const current =
    getStatus(oldRecords,dateKey);

  const next =
    nextStatus(current);

  const newRecords =
    replaceDayStatus(oldRecords,dateKey,next);

  student.records = newRecords;
  savingCells.add(saveKey);

  render();

  try{
    await workerRequest(
      "/students/" + encodeURIComponent(studentId) + "/attendance",
      {
        method:"PATCH",
        body:JSON.stringify({records:newRecords})
      }
    );

  }catch(error){
    console.error("Attendance save error:",error);

    student.records = oldRecords;

    showToast(
      "Attendance was not saved. Please try again.",
      true
    );
  }finally{
    savingCells.delete(saveKey);
    render();
  }
}

/* =========================
   BULK DAY SAVE
========================= */

async function commitInChunks(updateItems){
  const CHUNK_SIZE = 400;
  for(let i=0;i<updateItems.length;i+=CHUNK_SIZE){
    const chunk = updateItems.slice(i,i+CHUNK_SIZE);
    await workerRequest("/students/bulk-attendance",{
      method:"POST",
      body:JSON.stringify({
        courseId:selectedCourseId,
        updates:chunk
      })
    });
  }
}

async function setColumnStatus(dateKey,status){
  if(!ACTIVE_COURSE || !isCourseOpen(ACTIVE_COURSE)){
    showToast(
      "The course is closed. Attendance cannot be changed.",
      true
    );
    refreshCourseFilter("");
    return;
  }

  if(!FILTERED.length){
    return;
  }

  const label =
    status === "present"
      ? "mark all students PRESENT"
      : status === "absent"
        ? "mark all students ABSENT"
        : "clear attendance for all students";

  if(!confirm(`Do you want to ${label} for ${dateKey}?`)){
    return;
  }

  const backups =
    FILTERED.map(student=>({
      id:student.id,
      records:[...normalizeRecords(student.records)]
    }));

  const updates =
    FILTERED.map(student=>{
      const newRecords =
        replaceDayStatus(
          student.records,
          dateKey,
          status
        );

      student.records = newRecords;

      return {
        id:student.id,
        records:newRecords
      };
    });

  render();
  setBusy(true,"Saving attendance...");

  try{
    await commitInChunks(updates);
    showToast("Attendance saved successfully");
  }catch(error){
    console.error("Bulk attendance save error:",error);

    backups.forEach(backup=>{
      const student =
        STUDENTS.find(item=>item.id === backup.id);

      if(student){
        student.records = backup.records;
      }
    });

    render();

    showToast(
      "Unable to save all attendance. Changes were restored.",
      true
    );
  }finally{
    setBusy(false);
  }
}

/* =========================
   RENDER
========================= */

function render(){
  if(!ACTIVE_COURSE){
    return;
  }

  if(!DAYS.length){
    showTableMessage(
      "error",
      "Course dates are incomplete"
    );
    return;
  }

  if(!FILTERED.length){
    tbody.innerHTML = `
      <tr>
        <td colspan="${DAYS.length + 3}">
          <div class="empty-state">
            <div class="state-icon">
              <i class="fa-solid fa-user-group"></i>
            </div>
            <div>No students found in this course</div>
          </div>
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = "";

  FILTERED.forEach((student,index)=>{
    const records =
      normalizeRecords(student.records);

    const summary =
      summarize(records);

    const percent =
      summary.total
        ? Math.round(summary.P / summary.total * 100)
        : 0;

    const cells =
      DAYS.map(dateKey=>{
        const status =
          getStatus(records,dateKey);

        const saveKey =
          `${student.id}__${dateKey}`;

        const isSaving =
          savingCells.has(saveKey);

        const symbol =
          status === "present"
            ? "✔"
            : status === "late"
              ? "⏰"
              : status === "absent"
                ? "✖"
                : "";

        return `
          <td class="${isWeekend(dateKey) ? "weekend" : ""}">
            <div
              class="cell ${status || "none"} ${isSaving ? "saving" : ""}"
              title="Present → Late → Absent → Clear"
              onclick="toggleCell('${student.id}','${dateKey}')">
              ${symbol}
            </div>
          </td>
        `;
      }).join("");

    const tr =
      document.createElement("tr");

    if(summary.A >= 3){
      tr.classList.add("abs3");
    }

    const nameEn =
      student.name_en ||
      student.name ||
      "-";

    const nameAr =
      student.name_ar || "";

    tr.innerHTML = `
      <td class="sticky-index">${index+1}</td>

      <td class="sticky-name">
        <div class="name-en">${escapeHtml(nameEn)}</div>
        ${
          nameAr
            ? `<div class="name-ar">${escapeHtml(nameAr)}</div>`
            : ""
        }
      </td>

      ${cells}

      <td class="pct">${percent}%</td>
    `;

    tbody.appendChild(tr);
  });
}

/* =========================
   CLEANUP
========================= */

window.addEventListener("beforeunload",()=>{
  if(unsubscribeCourses){
    try{ unsubscribeCourses(); }catch(e){}
  }

  if(unsubscribeStudents){
    try{ unsubscribeStudents(); }catch(e){}
  }
});
</script>
