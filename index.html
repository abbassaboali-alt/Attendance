  <script>
  /* Prudle: approved HTTPS hosts and save-shortcut deterrent (not DRM). */
  (function () {
    "use strict";
    const LOGIN_URL = "https://www.prudle-education.com/log-in-out";
    const ALLOWED_HOSTS = new Set([
      "www.prudle-education.com", "prudle-education.com", "abbassaboali-alt.github.io"
    ]);
    window.addEventListener("keydown", function (event) {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
      }
    }, { capture: true });

    // In local dev and AI Studio preview environments, allow execution; in production enforce approved hosts.
    const isDevOrPreview = location.hostname.includes("localhost") ||
      location.hostname.includes("127.0.0.1") ||
      location.hostname.includes("run.app") ||
      location.hostname.includes("webcontainer") ||
      location.port !== "";

    window.__PRUDLE_HOST_ALLOWED = isDevOrPreview || (
      location.protocol === "https:" && ALLOWED_HOSTS.has(location.hostname.toLowerCase())
    );

    if (!window.__PRUDLE_HOST_ALLOWED) {
      window.stop();
      try { document.documentElement.innerHTML = ""; } catch (error) {}
      window.location.replace(LOGIN_URL);
      return;
    }

    // Canonicalize to www so valid first-party sessions are not split by host.
    if (location.hostname.toLowerCase() === "prudle-education.com") {
      window.__PRUDLE_HOST_ALLOWED = false;
      window.location.replace("https://www.prudle-education.com" +
        location.pathname + location.search + location.hash);
    }
  })();
  </script>
